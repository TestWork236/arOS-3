            background-repeat: no-repeat;
            
            /* Shrinking down Animation */
            animation: bgShrink 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Main Content Container */
        .content-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 16px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
            
            /* 3. Logo Growing Animation */
            /* Includes translateY to keep centering */
            animation: logoGrow 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-icon svg {
            width: 52px;
            height: 52px;
            fill: url(#logoGradient);
            shape-rendering: geometricPrecision;
        }

        .logo-text {
            font-size: 54px;
            font-weight: 500;
            letter-spacing: -0.4px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 20%, #e2c2f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Loading Spinner */
        .loader-container {
            position: absolute;
            bottom: 20%;
            /* 4. Spinner Entry Animation */
            opacity: 0; /* Start hidden */
            animation: spinnerSlideUp 0.8s ease-out 1s forwards; /* 1s delay */
        }

        .loader {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            position: relative;
            background: conic-gradient(from 0deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, #ffffff 100%);
            -webkit-mask: radial-gradient(closest-side, transparent 80%, black 82%);
            mask: radial-gradient(closest-side, transparent 80%, black 82%);
            animation: spin 1s linear infinite;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
        }

        /* --- Keyframes --- */

        @keyframes overlayFadeOut {
            0% { opacity: 1; }
            80% { opacity: 0; }
            100% { opacity: 0; visibility: hidden; }
        }

        @keyframes bgShrink {
            0% { transform: scale(1.15); } /* Start 15% larger */
            100% { transform: scale(1); }
        }

        @keyframes logoGrow {
            0% { 
                opacity: 0;
                transform: translateY(-20px) scale(0.85); 
            }
            100% { 
                opacity: 1;
                transform: translateY(-20px) scale(1); 
            }
        }

        @keyframes spinnerSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Black Overlay -->
    <div class="black-overlay"></div>

    <!-- Background Layer -->
    <div class="bg-layer"></div>

    <!-- Content -->
    <div class="content-container">
        <div class="logo-group">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="20%" style="stop-color:#ffffff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e2c2f5;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M 43.6,0.0 
                             L 0.0,50.9

                             L 98.2,49.1

                             L 21.8,45.3 
                             L 20.0,41.5 
                             L 38.2,22.6 
                             L 41.8,24.5 
                             L 41.8,32.1 
                             L 52.7,30.2 
                             L 50.9,0.0 Z" />
                </svg>
            </div>
            <div class="logo-text">arOS</div>
        </div>

        <div class="loader-container">
            <div class="loader"></div>
        </div>
    </div>

</body>
