<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arOS Boot Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="black-overlay" id="blackOverlay"></div>

    <div class="bg-layer" id="bootBackground"></div>
    <div class="setup-bg-layer" id="setupBackground"></div>

    <div class="content-container" id="contentContainer">
        <div class="logo-group" id="logoGroup">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="20%" style="stop-color:#ffffff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#e2c2f5;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M 43.6,0.0 
                             L 0.0,50.9 
                             L 3.6,54.7 
                             L 74.5,54.7 
                             L 76.4,60.4 
                             L 54.5,81.1 
                             L 50.9,69.8 
                             L 41.8,69.8 
                             L 41.8,96.2 
                             L 50.9,98.1 
                             L 90.9,60.4 
                             L 98.2,49.1 
                             L 94.5,45.3 
                             L 21.8,45.3 
                             L 20.0,41.5 
                             L 38.2,22.6 
                             L 41.8,24.5 
                             L 41.8,32.1 
                             L 52.7,30.2 
                             L 50.9,0.0 Z" />
                </svg>
            </div>
            <div class="logo-text">arOS</div>
        </div>

        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
